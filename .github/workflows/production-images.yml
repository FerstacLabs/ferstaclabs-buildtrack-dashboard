name: Production images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buildtrack_test
          POSTGRES_USER: buildtrack_test
          POSTGRES_PASSWORD: ci-only-ephemeral-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buildtrack_test -d buildtrack_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: dotnet build backend/BuildTrack.sln -c Release
      - run: dotnet test backend/BuildTrack.sln -c Release --no-build
        env:
          BUILDTRACK_TEST_POSTGRES: Host=localhost;Port=5432;Database=buildtrack_test;Username=buildtrack_test;Password=ci-only-ephemeral-test-password
      - run: for script in deploy.sh scripts/deploy.sh scripts/backup-db.sh; do bash -n "$script"; done
      - run: node scripts/deployment-audit.mjs
      - name: API readiness verifies real PostgreSQL connectivity
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:8080
          POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=buildtrack_test;Username=buildtrack_test;Password=ci-only-ephemeral-test-password;Timeout=3
          JWT_SECRET: ci-only-signing-key-not-used-for-production-1234
          BUILDTRACK_SECRET_KEY: ci-only-encryption-key-not-for-production-1234
        run: |
          dotnet backend/src/BuildTrack.Api/bin/Release/net8.0/BuildTrack.Api.dll > /tmp/buildtrack-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then ready=true; break; fi
            kill -0 "$pid"
            sleep 2
          done
          "$ready"
          docker stop '${{ job.services.postgres.id }}'
          status=$(curl --silent --max-time 30 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)
          test "$status" = 503
          docker start '${{ job.services.postgres.id }}'
      - name: Package deployment files only
        run: |
          mkdir -p deployment/scripts deployment/docs
          cp docker-compose.prod.yml .env.example deploy.sh deployment/
          cp scripts/deploy.sh scripts/backup-db.sh deployment/scripts/
          cp docs/production-deployment.md docs/security-deployment-audit.md deployment/docs/
          chmod +x deployment/deploy.sh deployment/scripts/*.sh
          tar -czf buildtrack-deployment.tar.gz -C deployment .
      - uses: actions/upload-artifact@v4
        with:
          name: buildtrack-deployment
          path: buildtrack-deployment.tar.gz
  images:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: buildtrack-api
            dockerfile: backend/src/BuildTrack.Api/Dockerfile
          - name: buildtrack-dahua-worker
            dockerfile: backend/src/BuildTrack.Worker.Dahua/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image namespace
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
